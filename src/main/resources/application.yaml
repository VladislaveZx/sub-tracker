spring:
  application:
    name: sub-tracker
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD}
    username: ${POSTGRES_USER}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT}
